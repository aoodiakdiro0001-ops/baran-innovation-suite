# ============================================================
# Data-Nexus ZeroBaran | GitHub Actions Workflow
# ETL Pipeline + AI Insights + Anomaly Detection
# ============================================================
name: "📊 Data-Nexus ZeroBaran Pipeline"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "وضع التشغيل"
        type: choice
        options:
          - etl_only
          - etl_and_analyze
          - anomaly_scan
          - weekly_report
          - full_pipeline
        default: full_pipeline
      source_file:
        description: "ملف البيانات (إن وُجد)"
        required: false
        default: "data/raw.csv"

  schedule:
    # يومياً الساعة 4:00 UTC (7:00 بتوقيت مكة)
    - cron: "0 4 * * *"
    # تقرير أسبوعي كل إثنين 8:00 UTC
    - cron: "0 8 * * 1"

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  DATA_TELEGRAM_BOT_TOKEN: ${{ secrets.DATA_TELEGRAM_BOT_TOKEN }}
  DATA_TELEGRAM_CHAT_ID: ${{ secrets.DATA_TELEGRAM_CHAT_ID }}
  DATA_SUPABASE_URL: ${{ secrets.DATA_SUPABASE_URL }}
  DATA_SUPABASE_ANON_KEY: ${{ secrets.DATA_SUPABASE_ANON_KEY }}

jobs:
  data-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "📦 Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r scanner/data/requirements.txt

      - name: "📁 Setup Workspace"
        run: mkdir -p processed insights anomalies

      # ============================================================
      # 1. ETL Pipeline — استخراج وتنظيف
      # ============================================================
      - name: "🔄 Run ETL Pipeline"
        if: github.event.inputs.mode != 'weekly_report' || github.event_name == 'schedule'
        run: |
          if [ -f "${{ github.event.inputs.source_file || 'data/raw.csv' }}" ]; then
            python scanner/data/etl_pipeline.py \
              --input="${{ github.event.inputs.source_file || 'data/raw.csv' }}" \
              --output=processed/clean_data.parquet \
              --source=csv
          else
            echo "⚠️ لا يوجد ملف بيانات. سأُنشئ بيانات تجريبية."
            python3 -c "
          import csv, random
          with open('data/raw.csv', 'w', encoding='utf-8') as f:
              w = csv.writer(f)
              w.writerow(['order_id', 'product', 'price', 'quantity', 'total', 'date', 'country'])
              for i in range(1, 1001):
                  price = round(random.uniform(10, 500), 2)
                  qty = random.randint(1, 5)
                  w.writerow([i, f'Product_{i%20}', price, qty, price*qty, f'2026-10-{i%30+1:02d}', random.choice(['SA', 'AE', 'EG', 'TR', 'JO'])])
          "
            python scanner/data/etl_pipeline.py \
              --input=data/raw.csv \
              --output=processed/clean_data.parquet \
              --source=csv
          fi
        continue-on-error: true

      # ============================================================
      # 2. كشف الشذوذ
      # ============================================================
      - name: "🚨 Detect Anomalies"
        if: github.event.inputs.mode == 'anomaly_scan' || github.event.inputs.mode == 'full_pipeline'
        run: |
          python scanner/data/anomaly_detector.py \
            --file=processed/clean_data_report.json \
            --method=iqr \
            --threshold=1.5 \
            --output=anomalies/detected.json
        continue-on-error: true

      # ============================================================
      # 3. AI Insights — تحليل Gemini
      # ============================================================
      - name: "🧠 Generate AI Insights"
        if: |
          (github.event.inputs.mode == 'etl_and_analyze' ||
           github.event.inputs.mode == 'full_pipeline') &&
          env.GEMINI_API_KEY != ''
        run: |
          # بناء ملخص إحصائي من تقرير ETL
          SUMMARY=$(python3 -c "
          import json
          try:
              with open('processed/clean_data_report.json') as f:
                  r = json.load(f)
              print(f\"حلّل {r['final_rows']} صف من {r['columns']} عمود. جودة البيانات: {r['quality_score']}%. مدة المعالجة: {r['duration_ms']}ms. القيم الشاذة: {len(r.get('outliers', {}))} أعمدة.\")
          except Exception as e:
              print(f'تحليل بيانات تجريبية: 1000 صف، 7 أعمدة، جودة 87%.')
          " 2>/dev/null || echo "تحليل بيانات: 1000 صف، 7 أعمدة، جودة 87%.")

          python scanner/data/ai_insights.py \
            --dataset="Data-Nexus Raw Pipeline" \
            --summary="$SUMMARY" \
            --metrics="price,quantity,total,quality_score" \
            --output=insights/ai_analysis.json
        continue-on-error: true

      # ============================================================
      # 4. التقرير الأسبوعي عبر Telegram
      # ============================================================
      - name: "📊 Send Weekly Report"
        if: |
          (github.event.inputs.mode == 'weekly_report' || github.event.inputs.mode == 'full_pipeline') &&
          env.DATA_TELEGRAM_BOT_TOKEN != '' &&
          env.DATA_TELEGRAM_CHAT_ID != ''
        run: |
          python scanner/data/telegram_alerts.py --weekly
        continue-on-error: true

      # ============================================================
      # 5. تنبيه فوري إذا اكتُشف شذوذ حرج
      # ============================================================
      - name: "🚨 Send Critical Anomaly Alerts"
        if: env.DATA_TELEGRAM_BOT_TOKEN != '' && env.DATA_TELEGRAM_CHAT_ID != ''
        run: |
          if [ -f "anomalies/detected.json" ]; then
            python3 -c "
          import json, os, urllib.request
          with open('anomalies/detected.json') as f:
              anomalies = json.load(f)
          critical = [a for a in anomalies if a.get('anomalies_count', 0) > 5]
          if critical:
              bot = os.environ.get('DATA_TELEGRAM_BOT_TOKEN', '')
              chat = os.environ.get('DATA_TELEGRAM_CHAT_ID', '')
              text = '🚨 *تنبيه Data-Nexus فوري*\n\n'
              for a in critical:
                  text += f\"• الشذوذ في مقياس \\\`{a['metric']}\\\`: {a['anomalies_count']} قيمة خارج النطاق\n\"
              url = f'https://api.telegram.org/bot{bot}/sendMessage'
              payload = json.dumps({'chat_id': chat, 'text': text, 'parse_mode': 'Markdown'}).encode()
              req = urllib.request.Request(url, data=payload, headers={'Content-Type': 'application/json'})
              urllib.request.urlopen(req, timeout=15)
          " 2>/dev/null || true
          fi
        continue-on-error: true

      # ============================================================
      # 6. Upload Artifacts
      # ============================================================
      - name: "📤 Upload Results"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-nexus-${{ github.run_id }}
          path: |
            processed/
            insights/
            anomalies/
          retention-days: 30

      # ============================================================
      # 7. ملخص
      # ============================================================
      - name: "✅ Summary"
        if: always()
        run: |
          echo "### 📊 Data-Nexus ZeroBaran — تقرير المعالجة" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**الوضع:** \`${{ github.event.inputs.mode || 'scheduled' }}\`" >> $GITHUB_STEP_SUMMARY
          if [ -f "processed/clean_data_report.json" ]; then
            cat processed/clean_data_report.json | python3 -c "
          import json, sys
            r = json.load(sys.stdin)
            print(f\"**الصفوف النهائية:** {r['final_rows']}\")
            print(f\"**جودة البيانات:** {r['quality_score']}%\")
            print(f\"**مدة المعالجة:** {r['duration_ms']}ms\")
          " >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          fi
          if [ -f "insights/ai_analysis.json" ]; then
            cat insights/ai_analysis.json | python3 -c "
          import json, sys
            r = json.load(sys.stdin)
            print(f\"**الثقة الإجمالية:** {r.get('confidence', 0)}%\")
            print(f\"**التوصيات:** {len(r.get('recommendations', []))}\")
          " >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          fi
